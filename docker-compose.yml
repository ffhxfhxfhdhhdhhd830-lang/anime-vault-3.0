services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  bot:
    build: .
    env_file: .env
    # For Compose, set MONGODB_URI=mongodb://mongo:27017 in .env.
    # Keeping this in .env also allows MongoDB Atlas connection strings.
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodb_data:
